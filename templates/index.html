<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MeTify</title>

    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="icon" type="image/png" href="/static/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MeTify" />
    <link rel="manifest" href="/static/favicon/site.webmanifest" />
</head>

<body>
    <header class="header">
        <div class="logo">
            <img src="/static/favicon/favicon.svg" alt="MeTify logo">
            <span>MeTify</span>
        </div>

        <button id="theme-toggle">
            <i class="fa-solid fa-moon"></i>
        </button>
    </header>

    <main class="container">
        <section class="card">
            <h2>New download</h2>
            <form id="downloadForm" class="grid">
                <label class="full">Spotify URL
                    <input name="url" type="url" placeholder="Enter a Track, Album or Playlist URL" required>
                </label>

                <label>Audio source
                    <select name="audio" class="js-multi-select" multiple>
                        <option value="youtube" selected>youtube</option>
                        <option value="youtube-music" selected>youtube-music</option>
                    </select>
                </label>

                <label>Options
                    <select name="options" class="js-multi-select" multiple>
                        <option value="--generate-lrc">Generate lyrics</option>
                        <option value="--skip-explicit">Skip explicit</option>
                        <option value="--only-verified-results">Only verified results</option>
                    </select>
                </label>

                <label>Max retries
                    <input name="max_retries" type="number" min="0" max="99" value="4">
                </label>

                <label>Threads
                    <input name="max_threads" type="number" min="1" max="99" value="1"> 
                </label>

                <label>Bitrate
                    <select name="bitrate" class="js-single-select">
                        <option selected>auto</option>
                        <option>128k</option>
                        <option>256k</option>
                        <option>320k</option>
                    </select>
                </label>

                <label>Format
                    <select name="format" class="js-single-select">
                        <option selected>mp3</option>
                        <option>flac</option>
                        <option>m4a</option>
                        <option>wav</option>
                    </select>
                </label>

                <button class="full download-button" type="submit">Start download</button>
            </form>
            <p id="message" class="message"></p>
        </section>

        <br>

        <section class="columns">
            <div class="card">
                <div class="selection-bar">
                    <h2>Jobs</h2>
                    <div>
                        <button onclick="downloadJobs()">
                            <i class="fa-solid fa-download"></i> Download jobs file
                        </button>
                        <button class="danger" onclick="clearJobs()">
                            <i class="fa-solid fa-trash-can"></i> Delete completed jobs
                        </button>
                    </div>
                </div>

                <div id="jobs" class="list"></div>
            </div>
            <div class="card">
                <h2>Downloaded files</h2>
                <div class="selection-bar">
                    <label>
                        <input type="checkbox" id="select-all-files">
                        Select all
                    </label>
                    <span id="selection-count" class="muted">0 selected</span>
                    <div class="actions">
                        <button onclick="downloadSelectedFiles()">
                            <i class="fa-solid fa-download"></i> Download selected
                        </button>
                        <button class="danger" onclick="deleteSelectedFiles()">
                            <i class="fa-solid fa-trash-can"></i> Delete selected
                        </button>
                    </div>
                </div>
                <div id="files" class="list"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <a href="https://github.com/Kikkerslijm410/MeTify" target="_blank" class="github-link">
            <i class="fab fa-github"></i>
            GitHub
        </a>

        <a href="https://github.com/Kikkerslijm410?tab=repositories" target="_blank" class="github-link">
            <i class="fa-solid fa-code"></i>
            More projects
        </a>

        <button id="version-check" class="github-link version-badge" title="Check for updates">
            <i class="fa-solid fa-rotate fa-spin"></i>
        </button>
    </footer>

    <script src="../static/scripts/app.js"></script>
</body>
</html>
